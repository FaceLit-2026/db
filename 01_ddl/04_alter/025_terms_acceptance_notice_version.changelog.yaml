databaseChangeLog:
  - changeSet:
      id: facelit-terms-acceptance-notice-version
      author: facelit
      # A previous release may already have added this column from 06_migrations/002.
      preConditions:
        - onFail: MARK_RAN
        - onError: HALT
        - not:
            - columnExists:
                schemaName: legal
                tableName: terms_acceptance
                columnName: notice_version
      labels: ddl,alter,legal
      changes:
        - sqlFile:
            path: 025_terms_acceptance_notice_version.sql
            relativeToChangelogFile: true
      rollback:
        - sqlFile:
            path: ../../05_rollbacks/01_ddl/04_alter/025_terms_acceptance_notice_version.rollback.sql
            relativeToChangelogFile: true
